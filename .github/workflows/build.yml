name: Build
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Get a SonarQube Cloud token
        id: sonar-token
        shell: bash
        run: |
          OIDC_TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://dev.sonarcloud.io" | jq -er '.value')
          echo "::add-mask::$OIDC_TOKEN"
          SONAR_TOKEN=$(curl -fsS -X POST https://api.sc-dev13.io/authentication/token \
            --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
            --data-urlencode "subject_token=$OIDC_TOKEN" \
            --data-urlencode "subject_token_type=urn:ietf:params:oauth:token-type:id_token" \
            --data-urlencode "audience=https://dev.sonarcloud.io" | jq -er '.access_token')
          echo "::add-mask::$SONAR_TOKEN"
          echo "sonar-token=$SONAR_TOKEN" >> "$GITHUB_OUTPUT"
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ steps.sonar-token.outputs.sonar-token }}
        with:
          args: >
            -Dsonar.scanner.sonarcloudUrl=https://dev13.sc-dev13.io
            -Dsonar.scanner.apiBaseUrl=https://api.sc-dev13.io
