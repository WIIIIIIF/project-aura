name: Build
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - uses: SonarSource/sonarqube-auth-action@5ab3427506de9e197731cb0c122618788fccd519 # SC-60477 PR head
        id: auth-frontend
        with:
          sonar-api-base-url: https://api.sc-dev13.io
          oidc-audience: https://dev.sonarcloud.io
          project-key: wiiiiiif_project-aura-plus-999
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        with:
          args: >
            -Dsonar.scanner.sonarcloudUrl=https://dev13.sc-dev13.io
            -Dsonar.scanner.apiBaseUrl=https://api.sc-dev13.io
            -Dsonar.organization=${{ steps.auth-frontend.outputs.organization }}
            -Dsonar.projectKey=${{ steps.auth-frontend.outputs.project-key }}
